name: Manually Trigger Infra Pipeline

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger infra orchestrator
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/benjosilverio-nl/CashflowInfra/dispatches \
            -d '{"event_type": "build_all"}'